<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ส่งงาน"><meta name="theme-color" content="#F5F6F8"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png">
<title>ส่งงาน</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--sf:#fff;--ink:#18202B;--mu:#6B7685;--ln:#E3E6EB;--ac:#2D4EF5;--ok:#17A06B;--oks:#E3F6EE;--late:#E5484D;--lates:#FDECEC;--soon:#B7791F;--soons:#FFF4DC}
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{font:16px/1.5 'IBM Plex Sans Thai','Sarabun',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
.app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 100px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 2px 16px}
h1{font-size:26px;font-weight:700}.who{font-size:14px;color:var(--mu)}
.link{color:var(--ac);font-weight:600;padding:8px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;background:var(--sf);border:1px solid var(--ln);font-size:15px;font-weight:500;color:var(--mu)}
.chip.active{background:var(--ac);border-color:var(--ac);color:#fff}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px}
.card.done{background:#FBFDFC}
.th{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.subject{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu);font-weight:500}
.subject i{width:10px;height:10px;border-radius:3px;flex:none}
.card h3{font-size:18px;font-weight:600;margin-top:4px;line-height:1.35;word-break:break-word}
.due{text-align:right;flex:none}.due b{display:block;font-size:15px}
.due span{font-size:13px;font-weight:500;padding:2px 8px;border-radius:999px;display:inline-block;margin-top:3px;background:var(--bg);color:var(--mu)}
.due.late span{background:var(--lates);color:var(--late)}.due.soon span{background:var(--soons);color:var(--soon)}
.acts{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;min-height:52px;padding:0 16px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--ac);color:#fff}.btn.ok{background:var(--oks);color:var(--ok)}.btn.ghost{background:var(--bg)}.btn.block{width:100%}
.rows{background:var(--sf);border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.pick{width:100%;text-align:left;min-height:58px;padding:0 16px;font-size:17px;border-bottom:1px solid var(--ln);display:block}
.pick:last-child{border:0}.pick:active{background:var(--bg)}
.hint{font-size:14px;color:var(--mu);margin:0 2px 12px}
.empty{text-align:center;padding:48px 24px;color:var(--mu)}.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:32px;max-width:460px;margin:0 auto}
#gate h2{font-size:24px}
.backdrop{position:fixed;inset:0;background:rgba(24,32,43,.38);z-index:60;display:none}.backdrop.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--sf);border-radius:24px 24px 0 0;max-height:85%;overflow-y:auto;transform:translateY(105%);transition:transform .25s;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sin{max-width:720px;margin:0 auto;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet h2{font-size:21px;margin-bottom:12px}
#keyBody{white-space:pre-wrap;word-break:break-word;line-height:1.7;-webkit-user-select:text;user-select:text;margin-bottom:16px}
#keyBody a{color:var(--ac)}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:15px;z-index:110;transition:all .25s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}.tabbar div{max-width:720px;margin:0 auto;display:flex;height:64px}.tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:var(--mu)}.tab.active{color:var(--ac)}.btn.dis{background:var(--bg);color:var(--mu)}
.alert{background:var(--soons);color:#6B4A0B;border:1px solid #F0DDAE;border-radius:16px;padding:12px 16px;margin-bottom:12px}.alert.late{background:var(--lates);color:#9B1C20;border-color:#F5C2C4}.alert b{display:block}.alert span{font-size:14px}
.kimgs img{width:100%;border-radius:14px;margin:8px 0;display:block}.news{background:#E8EEFF;color:#1B2E8F;border:1px solid #C5D2FF;border-radius:16px;padding:12px 16px;margin-bottom:12px}.news b{display:block}.news button{margin-top:6px;color:var(--ac);font-weight:600}
.pop{position:fixed;inset:0;z-index:120;background:rgba(24,32,43,.45);display:none;align-items:center;justify-content:center;padding:24px}.pop.open{display:flex}.pop .box{background:var(--sf);border-radius:24px;padding:24px;max-width:420px;width:100%;max-height:80%;overflow-y:auto}.pop h2{font-size:21px;margin-bottom:10px}.pop p{color:var(--mu);margin-bottom:6px;word-break:break-word}.pop ul{margin:8px 0 16px 20px}.pop li{margin-bottom:4px;word-break:break-word}
.field{width:100%;min-height:52px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
</style></head>
<body>
<div id="gate"><p>กำลังโหลด…</p></div>
<div class="app">
  <header class="top"><div><h1>ส่งงาน</h1><div class="who" id="who"></div></div><div style="display:flex;gap:4px;align-items:center"><button class="link" data-act="push" id="pushBtn">📲 แจ้งเตือน</button><button class="link" data-act="snd" id="sndBtn">🔕 เสียง</button><button class="link" data-act="logout">ออกจากระบบ</button></div></header>
  <div id="main"></div>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"><div class="sin"><h2>เฉลย</h2><div id="keyBody"></div><button class="btn ghost block" data-close>ปิด</button></div></div>
<nav class="tabbar" id="tabbar" hidden><div><button class="tab active" data-tab="tasks">งาน</button><button class="tab" data-tab="keys">เฉลยงาน</button></div></nav>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>
<div class="pop" id="pop"><div class="box"><h2 id="popT"></h2><div id="popB"></div><button class="btn primary block" id="popOk">รับทราบ</button></div></div>

<script>
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {getDatabase,ref,onValue,set,update,get} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";
import {getMessaging,getToken,onMessage,isSupported} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-messaging.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const cfg={
  apiKey:"AIzaSyB4vfR2nCgGMlNSNGl5a0iHlNaNI0LFHuM",
  authDomain:"harune-eb66f.firebaseapp.com",
  databaseURL:"https://harune-eb66f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"harune-eb66f",
  messagingSenderId:"555612322072",
  appId:"1:555612322072:web:b13dbf38f139a38c89066d"
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NS='ไม่ระบุวิชา';
const app=initializeApp(cfg),db=getDatabase(app),auth=getAuth(app);
const S={students:{},as:{},mine:{},ev:{},sid:null,subj:'',tab:'tasks'};
let uid=null,ready=false,seen={},tt;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
const gate=h=>{$('#gate').hidden=false;$('#gate').innerHTML=h};
const gateForm=(t,x)=>`<h2>${t}</h2><p class="hint">${x}</p><button class="btn primary block" data-act="login">เข้าสู่ระบบด้วย Google</button><p class="hint" style="text-align:center">หรือใช้อีเมล</p><input class="field" id="em" type="email" placeholder="อีเมล" autocomplete="email"><input class="field" id="pw" type="password" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)" autocomplete="current-password"><div style="display:flex;gap:10px"><button class="btn primary" style="flex:1" data-act="emlogin">เข้าสู่ระบบ</button><button class="btn ghost" style="flex:1" data-act="emnew">สมัครใหม่</button></div><p class="hint" id="gerr" style="color:#E5484D"></p>`;
const gerr=e=>{const m=$('#gerr');if(m)m.textContent='ไม่สำเร็จ: '+(e.code||e.message)};
const cred=()=>[$('#em').value.trim(),$('#pw').value];
function login(){const p=new GoogleAuthProvider();signInWithPopup(auth,p).catch(e=>{if(e.code==='auth/popup-closed-by-user')return;if(e.code==='auth/popup-blocked')signInWithRedirect(auth,p);else gerr(e)})}
getRedirectResult(auth).catch(e=>setTimeout(()=>gerr(e),600));

onAuthStateChanged(auth,async u=>{
  if(!u){gate(gateForm('เข้าสู่ระบบเพื่อส่งงาน','ใช้บัญชี Google หรืออีเมลของตัวเอง'));return}
  uid=u.uid;$('#gate').hidden=true;
  try{S.sid=(await get(ref(db,'users/'+uid))).val()}catch(e){S.sid=null}
  if(!ready){ready=true;onValue(ref(db,'students'),s=>{S.students=s.val()||{};render()},e=>toast('อ่านข้อมูลไม่ได้'))}
  if(S.sid){startTasks();enablePush(true)}
  render();
});

function startTasks(){
  if(startTasks.on)return;startTasks.on=true;
  onValue(ref(db,'assignments'),s=>{
    S.as=s.val()||{};
    try{
      const raw=localStorage.getItem('knownAs'),known=new Set(JSON.parse(raw||'[]')),ids=Object.keys(S.as);
      const fresh=ids.filter(i=>!known.has(i));
      if(raw!==null&&fresh.length)announce(fresh.map(i=>S.as[i].title||'งานใหม่'));
      localStorage.setItem('knownAs',JSON.stringify(ids));
    }catch(e){}
    for(const aid in S.as)if(!seen[aid]){seen[aid]=1;onValue(ref(db,`submissions/${aid}/${S.sid}`),x=>{S.mine[aid]=x.val()===true;render()});onValue(ref(db,`evidence/${aid}/${S.sid}/at`),x=>{S.ev[aid]=x.val()!=null;render()})}
    render();
  },e=>toast('อ่านข้อมูลไม่ได้'));
}

const hue=s=>{let h=0;for(const c of s||'')h=(h*31+c.charCodeAt(0))%360;return h};
function dueInfo(due){
  if(!due)return{label:'ไม่ระบุ',rel:'',cls:''};
  const [y,m,d]=due.split('-').map(Number),dt=new Date(y,m-1,d),t=new Date();t.setHours(0,0,0,0);
  const diff=Math.round((dt-t)/864e5),label=dt.toLocaleDateString('th-TH',{day:'numeric',month:'short'});
  if(diff<0)return{label,rel:'เลยกำหนด '+(-diff)+' วัน',cls:'late'};
  if(diff===0)return{label,rel:'ส่งวันนี้',cls:'soon'};
  if(diff===1)return{label,rel:'พรุ่งนี้',cls:'soon'};
  return{label,rel:'อีก '+diff+' วัน',cls:''};
}

function render(){
  if(!uid)return;
  $('#tabbar').hidden=!S.sid;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.tab));
  if(!S.sid){
    const free=Object.entries(S.students).filter(([,v])=>!v.uid).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
    $('#who').textContent='เลือกชื่อของคุณ';
    $('#main').innerHTML=`<p class="hint">เลือกครั้งเดียว ผูกกับบัญชีนี้ถาวร ถ้าเลือกผิดให้ครูปลดล็อกให้</p>`+
      (free.length?'<div class="rows">'+free.map(([id,v])=>`<button class="pick" data-claim="${esc(id)}">${esc(v.name)}</button>`).join('')+'</div>'
      :'<div class="empty"><h3>ไม่มีชื่อที่ว่าง</h3><p>ถ้าชื่อคุณไม่อยู่ในรายการ ให้แจ้งครู</p></div>');
    return;
  }
  $('#who').textContent=S.students[S.sid]?.name||'';
  const all=Object.entries(S.as).map(([id,v])=>({id,...v,done:!!S.mine[id]}))
    .sort((a,b)=>(a.done-b.done)||(a.due||'9999').localeCompare(b.due||'9999'));
  const subs=[...new Set(all.map(a=>a.subject||NS))].sort((a,b)=>a.localeCompare(b,'th'));
  if(S.subj&&!subs.includes(S.subj))S.subj='';
  const chips=subs.length>1?'<div class="chips">'+['',...subs].map(s=>{
    const n=all.filter(a=>!a.done&&(!s||(a.subject||NS)===s)).length;
    return `<button class="chip ${S.subj===s?'active':''}" data-subj="${esc(s)}">${s?esc(s):'ทั้งหมด'}${n?' · '+n:''}</button>`}).join('')+'</div>':'';
  const list=S.subj?all.filter(a=>(a.subject||NS)===S.subj):all;
  const keysTab=S.tab==='keys';
  const late=all.filter(a=>!a.done&&dueInfo(a.due).cls==='late').length,soon=all.filter(a=>!a.done&&dueInfo(a.due).cls==='soon').length,todo=all.filter(a=>!a.done).length;
  document.querySelector('[data-tab=tasks]').textContent='งาน'+(todo?` (${todo})`:'');
  const banner=!keysTab&&(late||soon)?`<div class="alert ${late?'late':''}"><b>${late?`⚠️ เลยกำหนด ${late} งาน`:''}${late&&soon?' · ':''}${soon?`⏰ ใกล้ส่ง ${soon} งาน`:''}</b><span>รีบแนบหลักฐานแล้วกดส่งงาน</span></div>`:'';
  const news=S.news&&S.news.length?`<div class="news"><b>🆕 มีงานใหม่ ${S.news.length} งาน</b><span>${S.news.map(esc).join(' · ')}</span><button data-act="nonews">รับทราบ</button></div>`:'';
  $('#main').innerHTML=news+banner+chips+(list.length?'<p class="hint">แตะที่งานเพื่อดูรายละเอียดและเฉลย</p>':'')+(list.length?'<div class="list">'+list.map(a=>{
    const di=dueInfo(a.due),id=esc(a.id),ev=S.ev[a.id];
    const head=`<div class="th"><div><div class="subject"><i style="background:hsl(${hue(a.subject)} 62% 52%)"></i>${esc(a.subject||NS)}</div><h3>${esc(a.title)}</h3></div>`;
    if(keysTab)return `<div class="card" data-card="${id}">${head}</div><div class="acts"><button class="btn ok" data-key="${id}">ดูเฉลย</button></div></div>`;
    return `<div class="card ${a.done?'done':''}" data-card="${id}">${head}<div class="due ${a.done?'':di.cls}"><b>${esc(di.label)}</b>${di.rel&&!a.done?`<span>${esc(di.rel)}</span>`:''}</div></div>
      <div class="acts">${a.done?`<button class="btn ok" data-toggle="${id}">✓ ส่งแล้ว (กดยกเลิก)</button><button class="btn ghost" data-key="${id}">ดูเฉลย</button>`
      :`<button class="btn ghost" data-evid="${id}">📷 ${ev?'เปลี่ยนรูปหลักฐาน':'เพิ่มหลักฐาน'}</button><button class="btn ${ev?'primary':'dis'}" data-toggle="${id}">ส่งงาน</button>`}</div>
      ${!a.done&&ev?'<p class="hint" style="margin:10px 0 0">📎 แนบหลักฐานแล้ว</p>':''}</div>`}).join('')+'</div>'
    :'<div class="empty"><h3>ยังไม่มีงาน</h3></div>');
}

async function claim(id){
  const n=S.students[id]?.name;
  if(!confirm(`ยืนยันว่าคุณคือ “${n}”?\nเลือกแล้วเปลี่ยนเองไม่ได้ ต้องให้ครูปลดล็อก`))return;
  try{await update(ref(db),{[`students/${id}/uid`]:uid,[`users/${uid}`]:id});S.sid=id;startTasks();render()}
  catch(e){console.error(e);toast('ชื่อนี้ถูกเลือกไปแล้ว หรือบัญชีนี้ผูกชื่ออื่นอยู่')}
}
async function toggle(aid){
  if(!S.mine[aid]&&!S.ev[aid])return toast('เพิ่มหลักฐานก่อนส่งงาน');const on=!S.mine[aid];S.mine[aid]=on;render();
  try{await set(ref(db,`submissions/${aid}/${S.sid}`),on?true:null)}
  catch(e){console.error(e);S.mine[aid]=!on;render();toast('บันทึกไม่สำเร็จ')}
}
async function showKey(aid){
  const a=S.as[aid]||{},di=dueInfo(a.due);
  const link=t=>esc(t).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  $('#sheet h2').textContent=a.title||'รายละเอียดงาน';
  $('#keyBody').innerHTML=`<p class="hint">${esc(a.subject||NS)} · กำหนดส่ง ${esc(di.label)}${di.rel?' ('+esc(di.rel)+')':''}</p>`+(a.detail?`<b>รายละเอียด</b>\n${link(a.detail)}\n\n`:'')+'<b>เฉลย</b>\n<span id="kt">กำลังโหลด…</span>';
  $('#backdrop').classList.add('open');$('#sheet').classList.add('open');
  let txt='ยังไม่มีเฉลยสำหรับงานนี้';
  let imgs=[],has=false;
  try{const v=(await get(ref(db,'answerKeys/'+aid))).val();if(v&&v.text){txt=v.text;has=true}}catch(e){txt='ดูเฉลยไม่ได้ ลองรีเฟรชหน้า'}
  try{const x=(await get(ref(db,'answerImgs/'+aid))).val();if(x)imgs=Object.values(x)}catch(e){console.error(e)}
  if(imgs.length){if(!has)txt='';}
  $('#kt').innerHTML=link(txt)+(imgs.length?'<div class="kimgs">'+imgs.map(u=>`<img src="${esc(u)}" alt="">`).join('')+'</div>':'');
}
const closeSheet=()=>{$('#backdrop').classList.remove('open');$('#sheet').classList.remove('open')};

let actx=null,soundOn=localStorage.getItem('snd')==='1',lastKey='';
function unlock(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state!=='running')actx.resume()}catch(e){}}
function ding(n=2){unlock();if(!actx)return;for(let i=0;i<n;i++){const t=actx.currentTime+i*.5,o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=i%2?880:1175;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.5)}}
function sndUI(){const b=$('#sndBtn');if(b)b.textContent=soundOn?'🔔 เสียง':'🔕 เสียง'}
function popup(t,lines,sub){$('#popT').textContent=t;$('#popB').innerHTML=(sub?`<p>${esc(sub)}</p>`:'')+(lines.length?'<ul>'+lines.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'');$('#pop').classList.add('open')}
$('#popOk').addEventListener('click',()=>$('#pop').classList.remove('open'));
function announce(titles){
  S.news=titles;ding(2);popup('🆕 มีงานใหม่',titles);
  try{if('Notification' in window&&Notification.permission==='granted')new Notification('มีงานใหม่',{body:titles.join(', ')})}catch(e){}
}
document.addEventListener('pointerdown',()=>{if(soundOn)unlock()});
setInterval(()=>{
  if(!soundOn)return;const d=new Date();if(d.getMinutes()!==0)return;
  const k=d.toDateString()+d.getHours();if(k===lastKey)return;lastKey=k;
  const h=d.getHours();if(h<8||h>20)return; // เงียบหลัง 20:00 ถึง 08:00
  const todo=Object.keys(S.as).filter(i=>!S.mine[i]).map(i=>(S.as[i].subject?S.as[i].subject+' · ':'')+S.as[i].title);
  ding(3);popup(`⏰ ${h}:00 น.`,todo,todo.length?`ยังมีงานค้าง ${todo.length} งาน`:'ไม่มีงานค้าง เยี่ยมมาก!');
},15000);
sndUI();

const VAPID='วาง_VAPID_KEY_ตรงนี้';
let onMsg=false;
async function enablePush(silent){
  try{
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
    if(ios&&!standalone){if(!silent)popup('ต้องเพิ่มลงหน้าจอโฮมก่อน',['แตะปุ่มแชร์ใน Safari','เลือก “เพิ่มลงในหน้าจอโฮม”','เปิดจากไอคอนบนหน้าจอโฮม แล้วกด 📲 แจ้งเตือน อีกครั้ง']);return}
    if(!S.sid)return;
    if(!(await isSupported())){if(!silent)toast('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน');return}
    let p=Notification.permission;
    if(p==='default'&&!silent)p=await Notification.requestPermission();
    if(p!=='granted'){if(!silent)toast('ยังไม่ได้อนุญาตการแจ้งเตือน (ตั้งค่า > แจ้งเตือน)');return}
    const reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');
    const msg=getMessaging(app);
    const token=await getToken(msg,{vapidKey:VAPID,serviceWorkerRegistration:reg});
    if(!token){if(!silent)toast('ขอ token ไม่สำเร็จ');return}
    await set(ref(db,'fcmTokens/'+uid),{token,sid:S.sid,at:Date.now()});
    if(!onMsg){onMsg=true;onMessage(msg,pl=>{const n=pl.notification||{};ding(2);popup(n.title||'แจ้งเตือน',n.body?[n.body]:[])})}
    if(!silent)toast('เปิดแจ้งเตือนแล้ว ✓');
  }catch(e){console.error(e);if(!silent)toast('เปิดแจ้งเตือนไม่สำเร็จ: '+(e.code||e.message))}
}

let pend=null;
function shrink(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const r=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);ok(c.toDataURL('image/jpeg',.7))};im.onerror=no;im.src=URL.createObjectURL(f)})}
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!pend)return;
  const aid=pend;toast('กำลังอัปโหลดรูป…');
  try{await set(ref(db,`evidence/${aid}/${S.sid}`),{img:await shrink(f),at:Date.now()});toast('แนบหลักฐานแล้ว กดส่งงานได้เลย')}
  catch(err){console.error(err);toast('แนบหลักฐานไม่สำเร็จ ลองใหม่อีกครั้ง')}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t){const c=e.target.closest('[data-card]');if(c)showKey(c.dataset.card);return}const d=t.dataset;
  if(d.act==='login')login();
  else if(d.act==='emlogin'){const [a,b]=cred();signInWithEmailAndPassword(auth,a,b).catch(gerr)}
  else if(d.act==='emnew'){const [a,b]=cred();createUserWithEmailAndPassword(auth,a,b).catch(gerr)}
  else if(d.act==='push')enablePush(false);
  else if(d.act==='snd'){soundOn=!soundOn;localStorage.setItem('snd',soundOn?'1':'0');sndUI();if(soundOn){unlock();ding(1);toast('เปิดเสียงเตือนทุกชั่วโมง (08:00–20:00)');try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}else toast('ปิดเสียงเตือนแล้ว')}
  else if(d.act==='nonews'){S.news=[];render()}
  else if(d.act==='logout'){signOut(auth).then(()=>location.reload())}
  else if(d.claim)claim(d.claim);
  else if(d.toggle)toggle(d.toggle);
  else if(d.key)showKey(d.key);
  else if(d.tab){S.tab=d.tab;render()}
  else if(d.evid){pend=d.evid;$('#file').click()}
  else if('lock' in d)toast('ส่งงานก่อนจึงจะดูเฉลยได้')
  else if('subj' in d){S.subj=d.subj;render()}
  else if('close' in d)closeSheet();
});
$('#backdrop').addEventListener('click',closeSheet);
</script>
</body></html>
