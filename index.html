<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ตรวจงานค้าง"><meta name="theme-color" content="#F5F6F8">
<title>ระบบตรวจงานค้าง</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--sf:#fff;--ink:#18202B;--mu:#6B7685;--ln:#E3E6EB;--ac:#2D4EF5;--acs:#E9EDFF;--ok:#17A06B;--oks:#E3F6EE;--late:#E5484D;--lates:#FDECEC;--soon:#B7791F;--soons:#FFF4DC;--tb:64px}
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:16px/1.5 'IBM Plex Sans Thai','Sarabun',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
.app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(var(--tb) + env(safe-area-inset-bottom,0px) + 96px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 16px}
h1{font-size:26px;font-weight:700}
.sync{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mu);background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:6px 12px}
.sync i{width:8px;height:8px;border-radius:50%;background:#B8BFCA}
.sync.on i{background:var(--ok);box-shadow:0 0 0 4px var(--oks)}
.view{display:none}.view.active{display:block}
.list{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;background:var(--sf);border:1px solid var(--ln);font-size:15px;font-weight:500;color:var(--mu)}
.chip.active{background:var(--ac);border-color:var(--ac);color:#fff}
.task{width:100%;text-align:left;display:block;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px 16px 14px}
.task.done{opacity:.62}
.th{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.subject{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu);font-weight:500}
.subject i{width:10px;height:10px;border-radius:3px;flex:none}
.task h3{font-size:18px;font-weight:600;margin-top:4px;line-height:1.35;word-break:break-word}
.due{text-align:right;flex:none}.due b{display:block;font-size:15px}
.due span{font-size:13px;font-weight:500;padding:2px 8px;border-radius:999px;display:inline-block;margin-top:3px;background:var(--bg);color:var(--mu)}
.due.late span{background:var(--lates);color:var(--late)}.due.soon span{background:var(--soons);color:var(--soon)}.due.ok span{background:var(--oks);color:var(--ok)}
.bar{height:8px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:14px}
.bar div{height:100%;background:var(--ac);border-radius:999px;transition:width .3s}
.bar.full div{background:var(--ok)}
.pg{margin-top:8px;font-size:14px;color:var(--mu)}.pg b{color:var(--ink)}
.fab{position:fixed;right:max(16px,calc((100vw - 720px)/2 + 16px));bottom:calc(var(--tb) + env(safe-area-inset-bottom,0px) + 16px);background:var(--ac);color:#fff;font-weight:600;min-height:56px;padding:0 22px;border-radius:999px;box-shadow:0 8px 24px rgba(45,78,245,.32);display:flex;align-items:center;gap:8px;z-index:20}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar div{max-width:720px;margin:0 auto;display:flex;height:var(--tb)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--mu)}
.tab.active{color:var(--ac)}
.btn{min-height:52px;padding:0 20px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--ac);color:#fff}.btn.ghost{background:var(--bg)}.btn.danger{background:var(--lates);color:var(--late)}.btn.block{width:100%}
.add-row{display:flex;gap:10px;margin-bottom:14px}.add-row input{flex:1;min-width:0}
.field{width:100%;min-height:52px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf)}
.field:focus{border-color:var(--ac);outline:none}
textarea.field{min-height:120px;resize:none;line-height:1.6}
.sub{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 12px;color:var(--mu);font-size:14px}
.link{color:var(--ac);font-weight:600;padding:8px 4px}
.rows{background:var(--sf);border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 8px 0 16px;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.row .name{flex:1;font-size:17px;padding:10px 0;word-break:break-word}.row .idx{width:26px;color:var(--mu);font-size:14px}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--acs);color:var(--ac)}
.ib{width:48px;height:48px;border-radius:12px;font-size:20px;color:var(--mu)}
.detail{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;overflow-y:auto}
.detail.open{display:block}
.din{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.back{min-height:48px;color:var(--ac);font-weight:600}
.din h2{font-size:24px;font-weight:700;line-height:1.3;margin-top:4px;word-break:break-word}
.summary{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:18px;margin:16px 0 14px}
.big{font-size:30px;font-weight:700}.big small{font-size:16px;font-weight:500;color:var(--mu);margin-left:4px}
.meta{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--mu)}
.seg{display:flex;background:#E8EAEE;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:600;font-size:15px;color:var(--mu)}
.seg button.active{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cr{width:100%;display:flex;align-items:center;gap:14px;text-align:left;min-height:62px;padding:0 16px;border-bottom:1px solid var(--ln);background:var(--sf)}
.cr:last-child{border:0}.crw{display:flex;align-items:center;background:var(--sf);border-bottom:1px solid var(--ln)}.crw:last-child{border:0}.crw .cr{flex:1;width:auto;border:0}.cr .name{flex:1;font-size:17px;padding:12px 0}.cr.on .name{color:var(--mu)}
.box{width:34px;height:34px;border-radius:50%;border:2px solid #C5CBD4;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.cr.on .box{background:var(--ok);border-color:var(--ok)}
.state{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--lates);color:var(--late)}
.cr.on .state{background:var(--oks);color:var(--ok)}
.key{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-top:20px}
.key b{display:block;margin-bottom:8px}.key .btn{margin-top:10px}
.hint{font-size:14px;color:var(--mu);margin-top:8px}
.hint code{background:rgba(0,0,0,.06);padding:1px 6px;border-radius:6px;word-break:break-all}
.dz{margin-top:24px}
.backdrop{position:fixed;inset:0;background:rgba(24,32,43,.38);z-index:60;display:none}.backdrop.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--sf);border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .25s;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sin{max-width:720px;margin:0 auto;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet h2{font-size:21px;margin-bottom:16px}
.sheet label{display:block;font-size:14px;font-weight:600;color:var(--mu);margin:14px 0 6px}
.acts{display:flex;gap:10px;margin-top:22px}.acts .btn{flex:1}
.empty{text-align:center;padding:48px 24px;color:var(--mu)}.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:32px;max-width:460px;margin:0 auto}
#gate h2{font-size:24px}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;bottom:calc(var(--tb) + env(safe-area-inset-bottom,0px) + 90px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:15px;z-index:110;transition:all .25s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head>
<body>
<div id="gate"><p>กำลังโหลด…</p></div>
<div class="app">
  <header class="topbar"><h1>ตรวจงานค้าง</h1>
    <div style="display:flex;gap:8px;align-items:center"><div class="sync" id="sync"><i></i><span id="syncText">กำลังเชื่อมต่อ</span></div><button class="link" data-act="logout">ออก</button></div>
  </header>
  <section class="view active" id="viewTasks"><div class="chips" id="chips"></div><div class="list" id="taskList"></div></section>
  <section class="view" id="viewPeople">
    <div class="add-row"><input class="field" id="personInput" placeholder="ชื่อนักเรียน / สมาชิก" autocomplete="off" enterkeyhint="done"><button class="btn primary" id="personAdd">เพิ่ม</button></div>
    <div class="sub"><span id="peopleCount"></span><button class="link" id="bulkOpen">เพิ่มหลายชื่อพร้อมกัน</button></div>
    <div id="peopleList"></div>
  </section>
  <section class="view" id="viewKeys"><div class="list" id="keyList"></div></section>
</div>
<button class="fab" id="fabAdd">＋ เพิ่มงาน</button>
<nav class="tabbar"><div>
  <button class="tab active" data-tab="tasks">งาน</button>
  <button class="tab" data-tab="people">รายชื่อ</button>
  <button class="tab" data-tab="keys">เฉลยงาน</button>
</div></nav>
<div class="detail" id="detail"><div class="din" id="detailBody"></div></div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheetTask"><div class="sin">
  <h2>เพิ่มงานใหม่</h2>
  <label for="fSubject">วิชา</label><input class="field" id="fSubject" list="subjectList" placeholder="เช่น คณิตศาสตร์" autocomplete="off"><datalist id="subjectList"></datalist>
  <label for="fTitle">ชื่องาน</label><input class="field" id="fTitle" placeholder="เช่น แบบฝึกหัดบทที่ 3" autocomplete="off">
  <label for="fDue">กำหนดส่ง</label><input class="field" id="fDue" type="date">
  <label for="fDetail">รายละเอียดงาน (ไม่บังคับ)</label><textarea class="field" id="fDetail" placeholder="เช่น หน้า 45-47 ข้อ 1-10 หรือวางลิงก์"></textarea>
  <div class="acts"><button class="btn ghost" data-close>ยกเลิก</button><button class="btn primary" id="taskSave">บันทึกงาน</button></div>
</div></div>
<div class="sheet" id="sheetBulk"><div class="sin">
  <h2>เพิ่มหลายชื่อพร้อมกัน</h2>
  <textarea class="field" id="bulkText" placeholder="หนึ่งบรรทัดต่อหนึ่งคน"></textarea>
  <div class="acts"><button class="btn ghost" data-close>ยกเลิก</button><button class="btn primary" id="bulkSave">เพิ่มรายชื่อ</button></div>
</div></div>
<div class="sheet" id="sheetEv"><div class="sin"><h2 id="evTitle">หลักฐาน</h2><div id="evBody"></div><button class="btn ghost block" data-close>ปิด</button></div></div>
<div class="toast" id="toast"></div>

<script>
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {getDatabase,ref,onValue,push,set,update,get} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const cfg={
  apiKey:"AIzaSyB4vfR2nCgGMlNSNGl5a0iHlNaNI0LFHuM",
  authDomain:"harune-eb66f.firebaseapp.com",
  databaseURL:"https://harune-eb66f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"harune-eb66f",
  appId:"1:555612322072:web:b13dbf38f139a38c89066d"
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={students:{},assignments:{},subs:{},keys:{},tab:'tasks',openId:null,pending:false,subj:''};
const app=initializeApp(cfg),db=getDatabase(app),auth=getAuth(app);
const NS='ไม่ระบุวิชา';

let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
async function safe(fn){try{await fn()}catch(e){console.error(e);toast('บันทึกไม่สำเร็จ (สิทธิ์ไม่พอหรือออฟไลน์)')}}
const onErr=e=>{console.error(e);$('#syncText').textContent='เชื่อมต่อไม่ได้'};
const gate=h=>{$('#gate').hidden=false;$('#gate').innerHTML=h};

/* ---------- ล็อกอิน ---------- */
const gateForm=(t,x)=>`<h2>${t}</h2><p class="hint">${x}</p><button class="btn primary block" data-act="login">เข้าสู่ระบบด้วย Google</button><p class="hint" style="text-align:center">หรือใช้อีเมล</p><input class="field" id="em" type="email" placeholder="อีเมล" autocomplete="email"><input class="field" id="pw" type="password" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)" autocomplete="current-password"><div style="display:flex;gap:10px"><button class="btn primary" style="flex:1" data-act="emlogin">เข้าสู่ระบบ</button><button class="btn ghost" style="flex:1" data-act="emnew">สมัครใหม่</button></div><p class="hint" id="gerr" style="color:#E5484D"></p>`;
const gerr=e=>{const m=$('#gerr');if(m)m.textContent='ไม่สำเร็จ: '+(e.code||e.message)};
const cred=()=>[$('#em').value.trim(),$('#pw').value];
function login(){const p=new GoogleAuthProvider();signInWithPopup(auth,p).catch(e=>{if(e.code==='auth/popup-closed-by-user')return;if(e.code==='auth/popup-blocked')signInWithRedirect(auth,p);else gerr(e)})}
getRedirectResult(auth).catch(e=>setTimeout(()=>gerr(e),600));
let started=false;
onAuthStateChanged(auth,async u=>{
  if(!u){gate(gateForm('เข้าสู่ระบบ','สำหรับครู / แอดมิน'));return}
  let ok=false;
  let why='';try{ok=(await get(ref(db,'admins/'+u.uid))).val()===true}catch(e){why=e.code||e.message}
  if(!ok){gate(`<h2>บัญชีนี้ไม่ใช่แอดมิน</h2><p>${esc(u.email||'')}</p>${why?`<p class="hint">ข้อผิดพลาด: ${esc(why)}</p>`:''}<p class="hint">ให้เจ้าของโปรเจกต์เพิ่มใน Firebase Console:<br><code>admins/${esc(u.uid)}</code> = true</p><button class="btn ghost block" data-act="logout">ออกจากระบบ</button>`);return}
  $('#gate').hidden=true;
  if(!started){started=true;start()}
});
function start(){
  onValue(ref(db,'.info/connected'),s=>{const on=s.val()===true;$('#sync').classList.toggle('on',on);$('#syncText').textContent=on?'ซิงก์สด':'ออฟไลน์'});
  const L=(p,k)=>onValue(ref(db,p),s=>{S[k]=s.val()||{};render()},onErr);
  L('students','students');L('assignments','assignments');L('submissions','subs');L('answerKeys','keys');
}

/* ---------- ตัวช่วย ---------- */
const studentList=()=>Object.entries(S.students).map(([id,v])=>({id,name:v.name,order:v.order||0,uid:v.uid})).sort((a,b)=>a.order-b.order||a.name.localeCompare(b.name,'th'));
const countDone=aid=>{const s=S.subs[aid]||{};let n=0;for(const k in S.students)if(s[k])n++;return n};
const hue=s=>{let h=0;for(const c of s||'')h=(h*31+c.charCodeAt(0))%360;return h};
function dueInfo(due,complete){
  if(!due)return{label:'ไม่ระบุ',rel:'',cls:''};
  const [y,m,d]=due.split('-').map(Number),dt=new Date(y,m-1,d),t=new Date();t.setHours(0,0,0,0);
  const diff=Math.round((dt-t)/864e5),label=dt.toLocaleDateString('th-TH',{day:'numeric',month:'short'});
  let rel,cls='';
  if(diff<0){rel='เลยกำหนด '+(-diff)+' วัน';cls='late'}else if(diff===0){rel='ส่งวันนี้';cls='soon'}else if(diff===1){rel='พรุ่งนี้';cls='soon'}else rel='อีก '+diff+' วัน';
  return{label,rel,cls:complete?'ok':cls};
}
function sorted(){
  const total=Object.keys(S.students).length;
  return Object.entries(S.assignments).map(([id,v])=>{const done=countDone(id);return{id,...v,total,done,complete:total>0&&done>=total}})
    .sort((a,b)=>(a.complete-b.complete)||(a.due||'9999').localeCompare(b.due||'9999')||(a.createdAt||0)-(b.createdAt||0));
}

/* ---------- Render ---------- */
function render(){renderTasks();renderPeople();renderKeys();renderDetail();
  $('#subjectList').innerHTML=[...new Set(Object.values(S.assignments).map(a=>a.subject).filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join('')}

function renderTasks(){
  const all=sorted(),subs=[...new Set(all.map(a=>a.subject||NS))].sort((a,b)=>a.localeCompare(b,'th'));
  if(S.subj&&!subs.includes(S.subj))S.subj='';
  $('#chips').innerHTML=subs.length>1?['',...subs].map(s=>{
    const n=all.filter(a=>!a.complete&&(!s||(a.subject||NS)===s)).length;
    return `<button class="chip ${S.subj===s?'active':''}" data-subj="${esc(s)}">${s?esc(s):'ทั้งหมด'}${n?' · '+n:''}</button>`}).join(''):'';
  const list=S.subj?all.filter(a=>(a.subject||NS)===S.subj):all,el=$('#taskList');
  if(!list.length){el.innerHTML='<div class="empty"><h3>ยังไม่มีงานในระบบ</h3><p>กด “เพิ่มงาน” เพื่อสร้างงานชิ้นแรก</p></div>';return}
  el.innerHTML=list.map(a=>{
    const di=dueInfo(a.due,a.complete),pct=a.total?Math.round(a.done/a.total*100):0;
    return `<button class="task ${a.complete?'done':''}" data-open="${esc(a.id)}">
      <div class="th"><div><div class="subject"><i style="background:hsl(${hue(a.subject)} 62% 52%)"></i>${esc(a.subject||NS)}${S.keys[a.id]?' · มีเฉลย':''}</div><h3>${esc(a.title)}</h3></div>
      <div class="due ${di.cls}"><b>${esc(di.label)}</b>${di.rel?`<span>${esc(di.rel)}</span>`:''}</div></div>
      <div class="bar ${a.complete?'full':''}"><div style="width:${pct}%"></div></div>
      <p class="pg">${a.total?`ส่งแล้ว <b>${a.done}/${a.total}</b> คน`:'ยังไม่มีรายชื่อ'}</p></button>`}).join('');
}

function renderKeys(){
  const l=sorted(),el=$('#keyList');
  el.innerHTML=l.length?l.map(a=>`<button class="task" data-open="${esc(a.id)}"><div class="subject"><i style="background:hsl(${hue(a.subject)} 62% 52%)"></i>${esc(a.subject||NS)}</div><h3>${esc(a.title)}</h3><p class="pg">${S.keys[a.id]?.text?'มีเฉลยแล้ว · แตะเพื่อแก้':'ยังไม่มีเฉลย · แตะเพื่อเพิ่ม'}</p></button>`).join(''):'<div class="empty"><h3>ยังไม่มีงาน</h3></div>';
}
function renderPeople(){
  const list=studentList();
  $('#peopleCount').textContent=list.length?`ทั้งหมด ${list.length} คน · ผูกบัญชีแล้ว ${list.filter(s=>s.uid).length}`:'';
  $('#peopleList').innerHTML=list.length?'<div class="rows">'+list.map((s,i)=>`<div class="row"><span class="idx">${i+1}</span><span class="name">${esc(s.name)}</span>
    ${s.uid?`<button class="tag" data-release="${esc(s.id)}">ผูกบัญชีแล้ว · ปลด</button>`:''}
    <button class="ib" data-del-student="${esc(s.id)}" aria-label="ลบ">🗑</button></div>`).join('')+'</div>'
    :'<div class="empty"><h3>ยังไม่มีรายชื่อ</h3><p>พิมพ์ชื่อด้านบนแล้วกด “เพิ่ม”</p></div>';
}

function renderDetail(){
  const box=$('#detail'),a=S.assignments[S.openId];
  if(!S.openId||!a){box.classList.remove('open');if(S.openId&&!a)S.openId=null;return}
  box.classList.add('open');
  if(['keyText','detText'].includes(document.activeElement?.id))return;
  const st=studentList(),total=st.length,subs=S.subs[S.openId]||{},done=st.filter(s=>subs[s.id]).length,pct=total?Math.round(done/total*100):0;
  const di=dueInfo(a.due,total>0&&done===total),shown=S.pending?st.filter(s=>!subs[s.id]):st;
  const rows=!total?'<div class="empty"><h3>ยังไม่มีรายชื่อ</h3></div>':!shown.length?'<div class="empty"><h3>ส่งครบทุกคนแล้ว</h3></div>'
    :'<div class="rows">'+shown.map(s=>`<div class="crw"><button class="cr ${subs[s.id]?'on':''}" data-toggle="${esc(s.id)}"><span class="box">${subs[s.id]?'✓':''}</span><span class="name">${esc(s.name)}</span><span class="state">${subs[s.id]?'ส่งแล้ว':'ยังไม่ส่ง'}</span></button>${subs[s.id]?`<button class="ib" data-evid="${esc(s.id)}" aria-label="หลักฐาน">📷</button>`:''}</div>`).join('')+'</div>';
  const top=box.scrollTop;
  $('#detailBody').innerHTML=`<button class="back" data-back>‹ งานทั้งหมด</button>
    <div class="subject"><i style="background:hsl(${hue(a.subject)} 62% 52%)"></i>${esc(a.subject||NS)}</div><h2>${esc(a.title)}</h2>
    <div class="summary"><div class="big">ส่งแล้ว ${done}/${total}<small>คน</small></div>
    <div class="bar ${total&&done===total?'full':''}"><div style="width:${pct}%"></div></div>
    <div class="meta"><span>กำหนดส่ง ${esc(di.label)}</span><span>${esc(di.rel)}</span></div></div>
    ${total-done?'<button class="btn ghost block" data-copy style="margin-bottom:12px">📋 คัดลอกข้อความทวงคนที่ยังไม่ส่ง</button>':''}
    <div class="seg"><button data-filter="all" class="${S.pending?'':'active'}">ทั้งหมด (${total})</button><button data-filter="pending" class="${S.pending?'active':''}">ยังไม่ส่ง (${total-done})</button></div>
    ${rows}
    <div class="key"><b>รายละเอียดงาน</b><textarea class="field" id="detText" placeholder="บอกว่าต้องทำอะไร หน้าไหน หรือวางลิงก์">${esc(a.detail||'')}</textarea><button class="btn primary block" data-savedet>บันทึกรายละเอียด</button></div>
    <div class="key"><b>เฉลยงาน</b><textarea class="field" id="keyText" placeholder="พิมพ์เฉลย หรือวางลิงก์ไฟล์เฉลย">${esc(S.keys[S.openId]?.text||'')}</textarea>
    <button class="btn primary block" data-savekey>บันทึกเฉลย</button><p class="hint">นักเรียนทุกคนที่ล็อกอินดูเฉลยได้ทันที</p></div>
    <div class="dz"><button class="btn danger block" data-del-task>ลบงานนี้</button></div>`;
  box.scrollTop=top;
}

/* ---------- Actions ---------- */
function toggleSub(sid){
  const aid=S.openId,on=!(S.subs[aid]&&S.subs[aid][sid]);
  S.subs[aid]=S.subs[aid]||{};on?S.subs[aid][sid]=true:delete S.subs[aid][sid];render();
  safe(()=>set(ref(db,`submissions/${aid}/${sid}`),on?true:null));
}
async function addStudents(names){
  const clean=names.map(n=>n.trim()).filter(Boolean);if(!clean.length)return;
  const base=Date.now(),u={};
  clean.forEach((name,i)=>{u[`students/${push(ref(db,'students')).key}`]={name,order:base+i}});
  await safe(()=>update(ref(db),u));
}
async function deleteStudent(id){
  const s=S.students[id];if(!s||!confirm(`ลบ “${s.name}” ออกจากรายชื่อ?\nสถานะการส่งงานของคนนี้จะถูกลบด้วย`))return;
  const u={[`students/${id}`]:null};if(s.uid)u[`users/${s.uid}`]=null;
  Object.keys(S.assignments).forEach(a=>{u[`submissions/${a}/${id}`]=null;u[`evidence/${a}/${id}`]=null});
  await safe(()=>update(ref(db),u));
}
async function release(id){
  const s=S.students[id];if(!s||!confirm(`ปลดล็อกบัญชีที่ผูกกับ “${s.name}”?\nนักเรียนจะเลือกชื่อใหม่ได้`))return;
  await safe(()=>update(ref(db),{[`students/${id}/uid`]:null,[`users/${s.uid}`]:null}));
}
async function deleteTask(){
  const a=S.assignments[S.openId];if(!a||!confirm(`ลบงาน “${a.title}”?\nข้อมูลการส่งงานและเฉลยของงานนี้จะหายไป`))return;
  const id=S.openId;S.openId=null;
  await safe(()=>update(ref(db),{[`assignments/${id}`]:null,[`submissions/${id}`]:null,[`answerKeys/${id}`]:null,[`evidence/${id}`]:null}));
}
async function saveDet(){
  await safe(()=>set(ref(db,`assignments/${S.openId}/detail`),$('#detText').value.trim()||null));
  document.activeElement.blur();toast('บันทึกรายละเอียดแล้ว');renderDetail();
}
async function saveKey(){
  const v=$('#keyText').value.trim();
  await safe(()=>set(ref(db,'answerKeys/'+S.openId),v?{text:v}:null));
  document.activeElement.blur();toast(v?'บันทึกเฉลยแล้ว':'ลบเฉลยแล้ว');renderDetail();
}
async function saveTask(){
  const subject=$('#fSubject').value.trim(),title=$('#fTitle').value.trim(),due=$('#fDue').value;
  if(!subject||!title)return toast('กรอกวิชาและชื่องานให้ครบ');
  await safe(()=>set(ref(db,'assignments/'+push(ref(db,'assignments')).key),{subject,title,due,detail:$('#fDetail').value.trim(),createdAt:Date.now()}));
  closeSheets();$('#fTitle').value='';$('#fDetail').value='';
}
function copyChase(){
  const a=S.assignments[S.openId];if(!a)return;
  const subs=S.subs[S.openId]||{},miss=studentList().filter(x=>!subs[x.id]),di=dueInfo(a.due,false);
  const txt=`📢 ทวงงาน ${a.subject||''}: ${a.title}\nกำหนดส่ง ${di.label}${di.rel?' ('+di.rel+')':''}\nยังไม่ส่ง ${miss.length} คน:\n`+miss.map((x,i)=>`${i+1}. ${x.name}`).join('\n')+'\nรีบส่งด้วยนะ 🙏';
  const ok=()=>toast('คัดลอกแล้ว นำไปวางในกลุ่มไลน์ได้เลย');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(ok).catch(()=>{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();ok()});
}
async function showEv(sid){
  $('#evTitle').textContent='หลักฐาน · '+(S.students[sid]?.name||'');
  $('#evBody').innerHTML='<p class="hint">กำลังโหลด…</p>';openSheet('#sheetEv');
  try{const v=(await get(ref(db,`evidence/${S.openId}/${sid}`))).val();
    $('#evBody').innerHTML=v&&v.img?`<img src="${v.img}" style="width:100%;border-radius:14px;margin-bottom:16px">`:'<p class="hint" style="margin-bottom:16px">ไม่มีหลักฐานแนบ (ครูติ๊กให้เอง)</p>'}
  catch(e){$('#evBody').innerHTML='<p class="hint">อ่านหลักฐานไม่ได้</p>'}
}
const openSheet=id=>{$('#backdrop').classList.add('open');$(id).classList.add('open')};
function closeSheets(){$('#backdrop').classList.remove('open');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));document.activeElement?.blur()}
const ymd=d=>{const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.act==='login')login();
  else if(d.act==='emlogin'){const [a,b]=cred();signInWithEmailAndPassword(auth,a,b).catch(gerr)}
  else if(d.act==='emnew'){const [a,b]=cred();createUserWithEmailAndPassword(auth,a,b).catch(gerr)}
  else if(d.act==='logout')signOut(auth);
  else if(d.tab){S.tab=d.tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===t));
    $('#viewTasks').classList.toggle('active',S.tab==='tasks');$('#viewPeople').classList.toggle('active',S.tab==='people');$('#viewKeys').classList.toggle('active',S.tab==='keys');
    $('#fabAdd').style.display=S.tab==='tasks'?'flex':'none';scrollTo(0,0)}
  else if('subj' in d){S.subj=d.subj;renderTasks()}
  else if(d.open){S.openId=d.open;S.pending=false;render()}
  else if(d.toggle)toggleSub(d.toggle);
  else if(d.filter){S.pending=d.filter==='pending';renderDetail()}
  else if('back' in d){S.openId=null;render()}
  else if('delTask' in d)deleteTask();
  else if('savekey' in d)saveKey();
  else if('savedet' in d)saveDet();
  else if(d.delStudent)deleteStudent(d.delStudent);
  else if('copy' in d)copyChase();
  else if(d.evid)showEv(d.evid);
  else if(d.release)release(d.release);
  else if(t.id==='fabAdd'){$('#fDue').value=ymd(new Date(Date.now()+7*864e5));openSheet('#sheetTask')}
  else if(t.id==='taskSave')saveTask();
  else if(t.id==='personAdd'){const v=$('#personInput').value;$('#personInput').value='';addStudents([v])}
  else if(t.id==='bulkOpen')openSheet('#sheetBulk');
  else if(t.id==='bulkSave'){const l=$('#bulkText').value.split(/\r?\n/);$('#bulkText').value='';closeSheets();addStudents(l)}
  else if('close' in d)closeSheets();
});
$('#backdrop').addEventListener('click',closeSheets);
$('#personInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#personAdd').click()}});
</script>
</body></html>
